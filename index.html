ancel:"انصراف",total:"جمع",mismatch:"اختلاف مجموع با مبلغ کل:",fill:"تکمیل باقی‌مانده",pays:"می‌پردازد به",settled:"تسویه شد",method:"روش",cash:"نقد",transfer:"کارت به کارت",wallet:"کیف پول",export:"خروجی JSON",import:"بازیابی JSON",invalid:"فایل پشتیبان نامعتبر است",hAdded:"خانوار ذخیره شد",hDel:"خانوار حذف شد",inUse:"این خانوار در هزینه‌ها استفاده شده",eAdded:"هزینه با موفقیت ثبت شد",eDel:"هزینه حذف شد",bDone:"پشتیبان دانلود شد",restored:"اطلاعات بازیابی شد",confirm:"این مورد حذف شود؟",members:"نفر",allDone:"همه تسویه شدند!",needTwo:"ابتدا یک خانوار اضافه کنید",needPart:"حداقل یک شرکت‌کننده انتخاب کنید",needAmt:"مبلغ معتبر وارد کنید",impHint:"بازیابی، همه اطلاعات فعلی را جایگزین می‌کند.",food:"غذا",transport:"حمل‌ونقل",stay:"اقامت",fun:"تفریح",other:"سایر",IRT:"تومان",USD:"دلار",EUR:"یورو",AED:"درهم",lang:"English",in:"به تفکیک واحد پول"}};
const COLORS=["#6366f1","#10b981","#f59e0b","#ef4444","#06b6d4","#ec4899","#8b5cf6","#84cc16"];
const CATS=["food","transport","stay","fun","other"],CURS=["IRT","USD","EUR","AED"];

/* ============ pure utils ============ */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9);
// shares per household for one expense
function computeShares(e,hs){
  const ids=e.participants.filter(id=>hs.some(h=>h.id===id)),out={};
  if(!ids.length)return out;
  if(e.mode==="manual"){ids.forEach(id=>out[id]=Number(e.manual?.[id])||0);return out;}
  if(e.mode==="equal"){ids.forEach(id=>out[id]=e.amount/ids.length);return out;} // same share per household
  const tot=ids.reduce((s,id)=>s+hs.find(h=>h.id===id).headcount,0)||1;
  const perHead=e.amount/tot; // Share per member
  ids.forEach(id=>out[id]=perHead*hs.find(h=>h.id===id).headcount);
  return out;
}
// net balances: {currency:{hid:{paid,share,net}}}
function ledger(hs,es){
  const L={};
  es.forEach(e=>{
    const c=L[e.currency]??={};
    hs.forEach(h=>c[h.id]??={paid:0,share:0,net:0});
    if(c[e.payer])c[e.payer].paid+=e.amount;
    const sh=computeShares(e,hs);for(const id in sh)if(c[id])c[id].share+=sh[id];
  });
  for(const cur in L)for(const id in L[cur]){const x=L[cur][id];x.net=r2(x.paid-x.share);}
  return L;
}
// greedy debt minimisation: match largest debtor with largest creditor
function simplify(bal){
  const cr=[],db=[],out=[];
  for(const id in bal){const n=bal[id].net;if(n>0.01)cr.push({id,n});else if(n<-0.01)db.push({id,n:-n});}
  while(cr.length&&db.length){
    cr.sort((a,b)=>b.n-a.n);db.sort((a,b)=>b.n-a.n);
    const c=cr[0],d=db[0],a=r2(Math.min(c.n,d.n));
    out.push({from:d.id,to:c.id,amount:a});
    c.n=r2(c.n-a);d.n=r2(d.n-a);
    if(c.n<=0.01)cr.shift();if(d.n<=0.01)db.shift();
  }
  return out;
}

/* ============ state ============ */
const mkTrip=(name,o={})=>({id:uid(),name,dest:"",start:"",end:"",notes:"",link:"",households:[],expenses:[],settled:{},currencies:CURS,categories:CATS,...o});
const validTrip=x=>x&&Array.isArray(x.households)&&Array.isArray(x.expenses)&&x.households.every(h=>h.id&&h.name&&h.headcount>=1)&&x.expenses.every(e=>e.id&&e.payer&&typeof e.amount==="number"&&Array.isArray(e.participants));
// accepts the multi-trip format and migrates the old single-trip format
function normalize(d){
  if(!d||typeof d!=="object")return null;
  if(Array.isArray(d.trips)){if(!d.trips.length||!d.trips.every(x=>x&&x.id&&validTrip(x)))return null;
    return {lang:d.lang||"en",trips:d.trips.map(x=>({...mkTrip(x.name||"Trip"),...x})),activeId:d.trips.some(x=>x.id===d.activeId)?d.activeId:d.trips[0].id};}
  if(validTrip(d)){const tr=mkTrip(d.name||"Trip 1",d);tr.id=uid();return {lang:d.lang||"en",trips:[tr],activeId:tr.id};}
  return null;
}
const load=()=>{try{const x=normalize(JSON.parse(localStorage.getItem("safardanesh")||"null"));if(x)return x}catch{}const tr=mkTrip("Trip 1");return {lang:"en",trips:[tr],activeId:tr.id}};
const reduce=(s,a)=>a.type==="set"?a.v:a.fn(s);
const Ctx=createContext();
const useApp=()=>useContext(Ctx);
function Provider({children}){
  const [R,d]=useReducer(reduce,null,load);
  const [dlg,setDlg]=useState(null);
  const trip=R.trips.find(x=>x.id===R.activeId)||R.trips[0];
  const s={...trip,lang:R.lang}; // active trip + language
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{try{localStorage.setItem("safardanesh",JSON.stringify(R))}catch{}},[R]);
  useEffect(()=>{document.documentElement.dir=s.lang==="fa"?"rtl":"ltr";document.documentElement.lang=s.lang;},[s.lang]);
  const t=k=>T[s.lang][k]??k;
  const num=(n,dg=2)=>Number(n).toLocaleString(s.lang==="fa"?"fa-IR":"en-US",{maximumFractionDigits:dg});
  const toast=(m,err)=>{const id=uid();setToasts(x=>[...x,{id,m,err}]);setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==id)),2800)};
  const upd=fn=>d({type:"fn",fn:R0=>{const tr=R0.trips.find(x=>x.id===R0.activeId)||R0.trips[0];const {lang,...rest}=fn({...tr,lang:R0.lang});return {...R0,lang,trips:R0.trips.map(x=>x.id===tr.id?{...tr,...rest}:x)}}});
  const raw=fn=>d({type:"fn",fn});
  const ask=fn=>setDlg({fn});
  return <Ctx.Provider value={{s,R,t,num,upd,raw,ask,set:v=>d({type:"set",v}),toast}}>{children}
    {dlg&&<Modal title={t("confirm")} onClose={()=>setDlg(null)}><div className="flex gap-2 justify-end"><Btn v="s" onClick={()=>setDlg(null)}>{t("cancel")}</Btn><Btn v="d" onClick={()=>{const f=dlg.fn;setDlg(null);f()}}>{t("del")}</Btn></div></Modal>}
    <div className="fixed top-4 inset-x-4 z-[60] flex flex-col items-center gap-2 pointer-events-none">
      {toasts.map(x=><div key={x.id} className={"fade px-4 py-2 rounded-2xl shadow-xl text-white text-sm "+(x.err?"bg-rose-600":"bg-slate-900")}>{x.m}</div>)}
    </div></Ctx.Provider>;
}

const Ic=({d,c="w-5 h-5"})=><svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;

const Money=({v,cur})=>{const {num,t}=useApp();return <span dir="ltr" className="whitespace-nowrap">{num(v)} <span className="text-xs text-slate-400">{t(cur)}</span></span>};

/* ============ Expenses ============ */
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function ExpenseForm({e,onClose}){
  const {s,t,upd,toast,num}=useApp();
  const hs=s.households;
  const [f,setF]=useState(e||{title:"",desc:"",amount:"",currency:"IRT",payer:hs[0]?.id,date:nowLocal(),category:"food",mode:"person",participants:hs.map(h=>h.id),manual:{}});
  const amt=Number(f.amount)||0;
  const manualSum=r2(f.participants.reduce((a,id)=>a+(Number(f.manual[id])||0),0));
  const diff=r2(amt-manualSum);
  const bad=f.mode==="manual"&&Math.abs(diff)>0.005;
  const toggle=id=>setF({...f,participants:f.participants.includes(id)?f.participants.filter(x=>x!==id):[...f.participants,id]});
  const fill=id=>setF({...f,manual:{...f.manual,[id]:r2((Number(f.manual[id])||0)+diff)}});
  const save=()=>{
    if(amt<=0||!f.title.trim())return toast(t("needAmt"),1);
    if(!f.participants.length)return toast(t("needPart"),1);

/* ============ Jalali dates ============ */
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy;if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  let gy;if(jy>979){gy=1600;jy-=979}else gy=621;
  let days=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  gy+=400*Math.floor(days/146097);days%=146097;
  if(days>36524){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;
  const sa=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;while(gm<13&&gd>sa[gm]){gd-=sa[gm];gm++}
  return [gy,gm,gd];
}
const JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const p2=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const faNum=n=>Number(n).toLocaleString("fa-IR",{useGrouping:false});
const maxDay=(y,m)=>m<7?31:m<12?30:(g2j(...j2g(y,12,30)).join()===[y,12,30].join()?30:29);
// date picker: Jalali selects in Persian mode, native input in English mode. value = Gregorian "YYYY-MM-DD" or ""
function DateField({value,onChange,clearable}){
  const {s}=useApp();
  if(s.lang!=="fa")return <input type="date" className={inp} value={value} onChange={e=>onChange(e.target.value)}/>;
  const td=g2j(...todayISO().split("-").map(Number));
  const cur=value?g2j(...value.split("-").map(Number)):["","",""];
  const ch=(i,v)=>{const p=cur.map((x,k)=>x===""?td[k]:x);p[i]=Number(v);p[2]=Math.min(p[2],maxDay(p[0],p[1]));
    const [gy,gm,gd]=j2g(...p);onChange(gy+"-"+p2(gm)+"-"+p2(gd));};
  const ys=[];for(let y=td[0]-3;y<=td[0]+3;y++)ys.push(y);if(cur[0]&&!ys.includes(cur[0]))ys.push(cur[0]);
  const sel="rounded-lg border border-indigo-200 bg-indigo-50/50 px-1.5 py-1.5 text-sm focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200";
  return <div className="flex gap-1 items-center" dir="rtl">
    <select className={sel+" w-16"} value={cur[2]} onChange={e=>ch(2,e.target.value)}>{value?null:<option value="">—</option>}{Array.from({length:cur[1]?maxDay(cur[0],cur[1]):31},(_,i)=>i+1).map(d=><option key={d} value={d}>{faNum(d)}</option>)}</select>
    <select className={sel+" flex-1"} value={cur[1]} onChange={e=>ch(1,e.target.value)}>{value?null:<option value="">—</option>}{JM.map((m,i)=><option key={i} value={i+1}>{m}</option>)}</select>
    <select className={sel+" w-20"} value={cur[0]} onChange={e=>ch(0,e.target.value)}>{value?null:<option value="">—</option>}{ys.sort().map(y=><option key={y} value={y}>{faNum(y)}</option>)}</select>
    {clearable&&value&&<button type="button" onClick={()=>onChange("")} className="p-1 text-slate-400 hover:text-rose-600"><Ic d={P.x} c="w-4 h-4"/></button>}
  </div>;
}

const copyText=(txt,ok)=>{try{const a=document.createElement("textarea");a.value=txt;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok()}catch{}};

const plansOf=tr=>{const L=ledger(tr.households,tr.expenses);return Object.keys(L).map(c=>[c,simplify(L[c])]).filter(([,p])=>p.length)};
const sKey=(c,x)=>`${c}|${x.from}|${x.to}|${x.amount}`;
// personal message for one household
function memberMsg(tr,h,t,num){
  const nm=id=>tr.households.find(x=>x.id===id)||{name:"?"},fmt=(v,c)=>num(v)+" "+t(c);
  const L=[tr.name+" – "+h.name];
  plansOf(tr).forEach(([c,p])=>p.forEach(x=>{if(tr.settled[sKey(c,x)]?.done)return;
    if(x.from===h.id){const o=nm(x.to);L.push(t("youPay")+" "+o.name+": "+fmt(x.amount,c)+(o.card?" ("+t("card")+": "+o.card+")":""));}
    if(x.to===h.id)L.push(t("youGet")+" "+nm(x.from).name+": "+fmt(x.amount,c));}));
  if(L.length===1)L.push(t("allDone"));
  return L.join("\n");
}
// group message: every expense with its payer, then who pays whom
function groupMsg(tr,t,num,lang){
  const nm=id=>tr.households.find(x=>x.id===id)?.name||"?",fmt=(v,c)=>num(v)+" "+t(c);
  const out=[tr.name+(tr.dest?" – "+tr.dest:""),"","🧾 "+t("expenses")+":"];
  if(!tr.expenses.length)out.push("—");
  [...tr.expenses].sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach((e,i)=>
    out.push(num(i+1,0)+". "+e.title+" ("+t(e.category)+") – "+fmt(e.amount,e.currency)+" – "+t("payer")+": "+nm(e.payer)+" – "+fmtDate(e.date,lang)));
  out.push("","💸 "+t("whoOwes")+":");
  const P2=plansOf(tr);
  if(!P2.length)out.push(t("allDone"));
  P2.forEach(([c,p])=>p.forEach(x=>out.push(nm(x.from)+" "+t("pays")+" "+nm(x.to)+": "+fmt(x.amount,c)+(tr.settled[sKey(c,x)]?.done?" ✅":""))));
  return out.join("\n");
}

          <button onClick={()=>del(tr)} className="p-2 rounded-xl text-rose-600 hover:bg-rose-50"><Ic d={P.trash} c="w-4 h-4"/></button></div>
      </Card>})}</div>
    {m&&<TripForm tr={m.id?m:null} onClose={()=>setM(null)}/>}
    {g&&<GroupModal tr={g} onClose={()=>setG(null)}/>}
  </div>;
}

/* ============ Who owes whom (top of Expenses tab) ============ */
function Owes(){
  const {s,t,upd,toast,num}=useApp();
  const plans=plansOf(s);
  const hh=id=>s.households.find(h=>h.id===id)||{name:"?",color:"#94a3b8"};
  const setS=(k,patch)=>upd(st=>({...st,settled:{...st.settled,[k]:{...st.settled[k],...patch}}}));
  const tell=h=>{const m=memberMsg(s,h,t,num);h.phone?sendSms(h.phone,m):copyText(m,()=>toast(t("copied")));};
  if(!plans.length)return null;
  return <Card className="mb-5"><div className="font-bold mb-3">{t("whoOwes")}</div>
    <div className="space-y-2">{plans.map(([c,p])=>p.map(x=>{const k=sKey(c,x),st=s.settled[k]||{},a=hh(x.from),b=hh(x.to);
      return <div key={k} className="fade flex flex-wrap items-center gap-2 text-sm">
        <input type="checkbox" checked={!!st.done} onChange={e=>setS(k,{done:e.target.checked})} className="w-4 h-4 accent-emerald-600"/>
        <span className={"flex-1 min-w-[10rem] "+(st.done?"line-through text-slate-400":"")}>
          <b style={{color:a.color}}>{a.name}</b>
          <button type="button" title={a.phone?t("sendSms"):t("copy")} onClick={()=>tell(a)} className="mx-1 p-1 rounded-lg text-indigo-600 hover:bg-indigo-50 align-middle"><Ic d={P.sms} c="w-4 h-4"/></button>
          {t("pays")} <b style={{color:b.color}}>{b.name}</b></span>
        <b className={st.done?"line-through text-slate-400":""}><Money v={x.amount} cur={c}/></b>
        <select value={st.method||"cash"} onChange={e=>setS(k,{method:e.target.value})} className="rounded-xl border border-slate-200 px-2 py-1 text-xs bg-white">{["cash","transfer","wallet"].map(m=><option key={m} value={m}>{t(m)}</option>)}</select>
      </div>}))}</div></Card>;
}

/* ============ PWA install ============ */
function useInstall(){
  const [ev,setEv]=useState(window.__bip||null); // the event may fire before React mounts, so index.html captures it
  useEffect(()=>{const h=()=>setEv(window.__bip||null),a=()=>{window.__bip=null;setEv(null)};
    window.addEventListener("bip-ready",h);window.addEventListener("appinstalled",a);
    return()=>{window.removeEventListener("bip-ready",h);window.removeEventListener("appinstalled",a)}},[]);
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const run=async()=>{const e=window.__bip;if(!e)return;e.prompt();try{await e.userChoice}catch{}window.__bip=null;setEv(null)};
  return {ev,standalone,run};
}
function InstallCheck(){
  const {t}=useApp();
  const [r,setR]=useState({});
  useEffect(()=>{(async()=>{
    const ok=async u=>{try{return (await fetch(u,{cache:"no-store"})).ok}catch{return false}};
    const sw="serviceWorker" in navigator?!!(await navigator.serviceWorker.getRegistration()):false;
    setR({"manifest.webmanifest":await ok("manifest.webmanifest"),"icon-192.png":await ok("icon-192.png"),"icon-512.png":await ok("icon-512.png"),"sw.js":await ok("sw.js"),"Service worker":sw,"HTTPS":location.protocol==="https:"||location.hostname==="localhost"});
  })()},[]);
  return <div><div className="text-xs font-semibold text-slate-500 mb-1">{t("helpCheck")}</div>
    <div dir="ltr" className="rounded-xl border border-indigo-100 bg-slate-50 p-2.5 text-xs space-y-1">{Object.entries(r).map(([k,v])=><div key={k}>{v?"✅":"❌"} {k}</div>)}</div></div>;
}
function InstallBtn(){
  const {t}=useApp();const {ev,standalone,run}=useInstall();const [help,setHelp]=useState(false);
  if(standalone)return null;
  return <><Btn onClick={()=>ev?run():setHelp(true)}><Ic d={P.dl} c="w-4 h-4"/>{t("install")}</Btn>
    {help&&<Modal title={t("helpTitle")} onClose={()=>setHelp(false)}>
      <div className="space-y-3 text-sm text-slate-600"><p>{t("helpAndroid")}</p><p>{t("helpIos")}</p><p className="text-xs text-slate-400">{t("helpNote")}</p><InstallCheck/></div></Modal>}</>;
}
function InstallBanner(){
  const {t}=useApp();const {ev,standalone,run}=useInstall();
  const [hide,setHide]=useState(()=>{try{return localStorage.getItem("sd-install-hide")==="1"}catch{return false}});
  const close=()=>{setHide(true);try{localStorage.setItem("sd-install-hide","1")}catch{}};
  if(standalone||hide||!ev)return null;
  return <div className="fade fixed inset-x-4 bottom-20 md:bottom-4 md:inset-x-auto md:end-4 md:max-w-sm z-40 bg-slate-900 text-white rounded-2xl shadow-xl p-4">
    <div className="font-bold mb-1">{t("installApp")}</div><div className="text-xs text-slate-300 mb-3">{t("installHint")}</div>
    <div className="flex gap-2 justify-end"><Btn v="s" className="!py-1" onClick={close}>{t("later")}</Btn><Btn className="!py-1" onClick={run}>{t("install")}</Btn></div></div>;
}

/* ============ Theme (day / night) ============ */
function ThemeBtn(){
  const {t}=useApp();
  const [th,setTh]=useState(document.documentElement.dataset.theme||"light");
  const flip=()=>{const n=th==="dark"?"light":"dark";document.documentElement.dataset.theme=n;
    try{localStorage.setItem("sd-theme",n)}catch{}
    const m=document.querySelector('meta[name=theme-color]');if(m)m.content=n==="dark"?"#0f172a":"#4f46e5";setTh(n)};
  return <Btn v="s" onClick={flip} title={t("theme")} className="!px-3"><Ic d={th==="dark"?P.sun:P.moon} c="w-4 h-4"/></Btn>;
}

/* ============ Shell ============ */
function App(){
  const {s,t,upd,R}=useApp();
  const [tab,setTab]=useState("trips");
  const tabs=[["trips",P.users],["expenses",P.wallet],["backup",P.db]];
  const View={trips:TripsPage,expenses:Expenses,backup:Backup}[tab];
  const Nav=({side})=>tabs.map(([k,ic])=><button key={k} onClick={()=>setTab(k)} className={(side?"flex-row w-full px-4 py-3 gap-3 rounded-2xl ":"flex-col flex-1 py-2 text-[11px] ")+"flex items-center justify-center font-semibold transition "+(tab===k?"text-indigo-600 "+(side?"bg-indigo-50":""):"text-slate-400 hover:text-slate-600")}><Ic d={ic}/>{t(k)}</button>);
  return <div className="min-h-screen md:flex">
    <aside className="hidden md:flex flex-col w-60 bg-white shadow-sm p-4 gap-2 sticky top-0 h-screen">
      <div className="mb-4"><div className="text-xl font-bold text-indigo-600">{t("app")}</div><div className="text-xs text-slate-400">{t("sub")}</div></div><Nav side/></aside>
    <main className="flex-1 max-w-4xl w-full mx-auto p-4 pb-28 md:pb-8">
      <header className="flex items-center justify-between mb-5 md:justify-end">
        <div className="md:hidden font-bold text-lg text-indigo-600">{t("app")}</div>
        <div className="flex gap-2"><InstallBtn/><ThemeBtn/><Btn v="s" onClick={()=>upd(st=>({...st,lang:st.lang==="en"?"fa":"en"}))}><Ic d={P.globe} c="w-4 h-4"/>{t("lang")}</Btn></div></header>
      <div className="text-xs text-slate-400 mb-3">{t("active")}: <b className="text-slate-600">{s.name}</b></div>
      <div key={tab+s.lang+R.activeId} className="fade"><View/></div></main>
    <InstallBanner/>
    <nav className="md:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur shadow-[0_-4px_20px_rgba(0,0,0,.06)] flex" style={{paddingBottom:"env(safe-area-inset-bottom,0px)"}}><Nav/></nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Provider><App/></Provider>);
</script>
</body>
